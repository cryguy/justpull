name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: scripts/build.sh "$GITHUB_REF_NAME"
      # A zipped artifact loses the exec bit and empty directories; a tar
      # uploaded as is keeps both.
      - run: tar -cf proxy.tar dist/proxy dist/rootfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: proxy.tar
          archive: false
          if-no-files-found: error
          retention-days: 1
      - run: gh release create "$GITHUB_REF_NAME" dist/justpull-* dist/SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proxy.tar
      - run: tar -xf proxy.tar
      - run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      # The builder runs BuildKit's image, pinned like the actions above.
      - run: docker buildx create --use --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.proxy -t "ghcr.io/cryguy/justpull:$GITHUB_REF_NAME" --push .
